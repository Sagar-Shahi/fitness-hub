{% extends 'base.html' %}
{% block title %}Check your email · FitHub{% endblock %}
{% block content %}
<section class="auth-card card">
  <h1>Check your inbox</h1>
  <p class="muted">If an account exists for that email address, a password-reset link is on its way. Check your spam folder too.</p>
  <a class="btn btn-primary btn-block" href="{% url 'accounts:login' %}">Back to log in</a>
</section>
{% endblock %}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]  # Django 5.0 supports 3.10 to 3.12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Deployment security check
        run: DJANGO_DEBUG=False DJANGO_SECRET_KEY=$(python -c "import secrets;print(secrets.token_urlsafe(60))") DJANGO_ALLOWED_HOSTS=example.com python manage.py check --deploy --fail-level ERROR
      - name: Dependency vulnerability scan
        run: pip install pip-audit && pip-audit -r requirements.txt
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: python manage.py test
